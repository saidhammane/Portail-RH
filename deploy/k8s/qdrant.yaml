apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onboarding-qdrant
spec:
  serviceName: onboarding-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: onboarding-qdrant
  template:
    metadata:
      labels:
        app: onboarding-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.15.4
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: onboarding-qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-qdrant
spec:
  type: ClusterIP
  selector:
    app: onboarding-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
