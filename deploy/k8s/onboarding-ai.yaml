apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onboarding-ai-api
  template:
    metadata:
      labels:
        app: onboarding-ai-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/saidhammane/portail-rh-onboarding-ai:replace-with-release-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: onboarding-ai-config
            - secretRef:
                name: onboarding-ai-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jobs
              mountPath: /data/jobs
      volumes:
        - name: jobs
          persistentVolumeClaim:
            claimName: onboarding-ai-jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-ai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onboarding-ai-worker
  template:
    metadata:
      labels:
        app: onboarding-ai-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/saidhammane/portail-rh-onboarding-ai:replace-with-release-tag
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: onboarding-ai-config
            - secretRef:
                name: onboarding-ai-secrets
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('onboarding-redis', 6379), 2).close()"
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('onboarding-redis', 6379), 2).close(); socket.create_connection(('onboarding-qdrant', 6333), 2).close()"
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jobs
              mountPath: /data/jobs
      volumes:
        - name: jobs
          persistentVolumeClaim:
            claimName: onboarding-ai-jobs
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-ai-api
spec:
  type: ClusterIP
  selector:
    app: onboarding-ai-api
  ports:
    - name: http
      port: 8000
      targetPort: http
