x-onboarding-ai-environment: &onboarding-ai-environment
  SERVICE_TOKEN: ${ONBOARDING_AI_SERVICE_TOKEN:?Set ONBOARDING_AI_SERVICE_TOKEN}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: onboarding_documents
  DATA_DIR: /data/jobs
  ODOO_CALLBACK_URL: http://odoo:8069/portail_rh/onboarding/index/callback?db=${ODOO_DATABASE:-odoo_dev}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_API_URL: ${LLM_API_URL:-http://ollama:11434}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen2.5:0.5b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-128}
  SESSION_TTL: ${SESSION_TTL:-3600}
  CACHE_TTL: ${CACHE_TTL:-900}

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    command: ["odoo", "--db-filter=^${ODOO_DATABASE:-odoo_dev}$$"]
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ZKTECO_API_URL: http://zkteco-mock:8090
      ZKTECO_API_KEY: ${ZKTECO_API_KEY:?Set ZKTECO_API_KEY}
      ZKTECO_TIMEZONE: ${ZKTECO_TIMEZONE:-Africa/Casablanca}
      PORTAIL_RH_DEMO_PASSWORD: ${PORTAIL_RH_DEMO_PASSWORD:-}
      ONBOARDING_AI_URL: http://onboarding-ai-api:8000
      ONBOARDING_AI_SERVICE_TOKEN: ${ONBOARDING_AI_SERVICE_TOKEN:?Set ONBOARDING_AI_SERVICE_TOKEN}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

  zkteco-mock:
    build:
      context: ./services/zkteco_mock
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      ZKTECO_API_KEY: ${ZKTECO_API_KEY:?Set ZKTECO_API_KEY}
      ZKTECO_SEED_MONTH: ${ZKTECO_SEED_MONTH:-2026-07}
    volumes:
      - zkteco-mock-data:/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - onboarding-redis-data:/data

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - onboarding-qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    environment:
      # Match the chat request so the warm-up runner can be reused immediately.
      OLLAMA_CONTEXT_LENGTH: "768"
      # This compact local model stays resident to avoid a 20-30 second cold load.
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # `run` pulls the model when needed and warms it before the API accepts traffic.
    command: ["run", "${LLM_CHAT_MODEL:-qwen2.5:0.5b}", "Reponds uniquement par READY."]

  onboarding-ai-api:
    image: portail-rh-onboarding-ai:local
    build:
      context: ./services/onboarding_ai
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama-model:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8088:8000"
    environment: *onboarding-ai-environment
    volumes:
      - onboarding-ai-jobs:/data/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  onboarding-ai-worker:
    image: portail-rh-onboarding-ai:local
    depends_on:
      onboarding-ai-api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    environment: *onboarding-ai-environment
    volumes:
      - onboarding-ai-jobs:/data/jobs

volumes:
  odoo-web-data:
  odoo-db-data:
  zkteco-mock-data:
  onboarding-redis-data:
  onboarding-qdrant-data:
  onboarding-ai-jobs:
  ollama-data:
