services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
      ZKTECO_API_URL: http://zkteco-mock:8090
      ZKTECO_API_KEY: ${ZKTECO_API_KEY:-zkteco-demo-key}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

  zkteco-mock:
    build:
      context: ./services/zkteco_mock
    ports:
      - "8090:8090"
    environment:
      ZKTECO_API_KEY: ${ZKTECO_API_KEY:-zkteco-demo-key}
      ZKTECO_SEED_MONTH: ${ZKTECO_SEED_MONTH:-2026-07}
    volumes:
      - zkteco-mock-data:/data

volumes:
  odoo-web-data:
  odoo-db-data:
  zkteco-mock-data:
